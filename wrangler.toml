# Cloudflare Pages 部署配置
# 文档: https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "wt-fm-analyzer"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# 部署说明:
# 1. 确保已安装 Node.js (>=18)
# 2. 首次使用运行: npx wrangler login   (浏览器授权)
#    或设置环境变量:
#      export CLOUDFLARE_API_TOKEN=你的令牌   (需 Cloudflare Pages 编辑权限)
#      export CLOUDFLARE_ACCOUNT_ID=你的账户ID  (使用令牌时必需)
# 3. 运行: bash deploy.sh
